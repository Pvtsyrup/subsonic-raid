function cards(s){

  <div class="card"><div class="k">Total Hard damage</div><div class="v" title="${full(s.total)}">${fmt(s.total)}</div><div class="s">${full(s.total)}</div></div>
  <div class="card"><div class="k">Hits used</div><div class="v">${s.hitsUsed} / ${s.maxHits}</div><div class="s">${Math.max(0,s.maxHits-s.hitsUsed)} unused · ${s.members.length} hitters</div></div>
  <div class="card"><div class="k">Boss kills</div><div class="v">${s.kills}</div><div class="s">final hits on Hard</div></div>
  <div class="card"><div class="k">Avg damage / hit</div><div class="v">${fmt(avg)}</div><div class="s">${full(avg)}</div></div>
  <div class="card"><div class="k">Top hitter</div><div class="v">${top?esc(top.name):"—"}</div><div class="s">${top?fmt(top.damage)+" in "+top.hits+" hits":""}</div></div>
  </div>`;
}

const COLS=[["rank","#","l"],["name","Name","l"],["synchro","Synchro"],["hits","Hits"],["damage","Total dmg"],["avg","Avg / hit"],["perSync","Dmg / synchro"],["kills","Kills"]];
function leaderboard(s){
  const ranked=[...s.members].sort((a,b)=>b.damage-a.damage);ranked.forEach((m,i)=>m.rank=i+1);
  const max=ranked.length?ranked[0].damage:1;
  const rows=[...ranked].sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(typeof x==="string"){x=x.toLowerCase();y=y.toLowerCase();return sortAsc?(x<y?-1:x>y?1:0):(x<y?1:x>y?-1:0)}return sortAsc?x-y:y-x});
  return `<div class="panel"><h2>Leaderboard · ${esc(s.label)} Hard <small>tap a header to sort · <svg class='crown' viewBox='0 0 16 12' aria-label='leader'><path d='M1 3l3.5 3L8 1l3.5 5L15 3l-1.5 8h-11z' fill='currentColor'/></svg> = union leaders</small></h2><label class="mepick">Highlight me <select id="meSel"></select></label><div class="tablewrap"><table><thead><tr>${COLS.map(c=>`<th data-k="${c[0]}" class="${c[2]||""} ${sortKey===c[0]?"sorted"+(sortAsc?" asc":""):""}">${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(m=>`<tr class="${m.me?"me":""}"><td class="rank l">${m.rank}</td><td class="l name">${esc(m.name)}${isLeader(m.name)?" <svg class='crown' viewBox='0 0 16 12' aria-label='leader'><path d='M1 3l3.5 3L8 1l3.5 5L15 3l-1.5 8h-11z' fill='currentColor'/></svg>":""}<div class="bar" style="width:${(m.damage/max*100).toFixed(1)}%"></div></td><td>${m.synchro}</td><td>${m.hits}</td><td title="${full(m.damage)}">${fmt(m.damage)}</td><td title="${full(m.avg)}">${fmt(m.avg)}</td><td title="${full(m.perSync)}">${fmt(m.perSync)}</td><td>${m.kills||""}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function bossPanel(s){
  const max=Math.max(...s.bosses.map(b=>b.damage),1);
  if(!s.bosses.length)return `<div class="panel"><h2>Damage by boss</h2><div class="note">No Hard Mode hits yet.</div></div>`;
  return `<div class="panel"><h2>Damage by boss <small>bar color = boss element</small></h2>${s.bosses.map(b=>`<div class="boss"><div class="row1"><span><b>${esc(b.name)}</b> <span class="pill" style="background:${ecol(b.element)}">${esc(b.element)}</span>${b.weak?` <span class="muted">· weak to</span> <span class="pill" style="background:${ecol(b.weak)}">${esc(b.weak)}</span>`:""}</span><span title="${full(b.damage)}">${fmt(b.damage)}</span></div><div class="track"><div class="fill" style="width:${(b.damage/max*100).toFixed(1)}%;background:${ecol(b.element)}"></div></div><div class="meta">Boss ${b.step} · ${b.hits} hits · ${b.kills} kill${b.kills===1?"":"s"} · reached level ${b.lap} · ${s.total?(b.damage/s.total*100).toFixed(1):0}% of total</div></div>`).join("")}</div>`;
}

function trendPanel(s){
  const list=allSeasons().filter(x=>x.available||!x.live);
  const order=[...list].reverse(); // oldest -> newest (live is newest)
  const opts=DATA.people.map(p=>people[p.key]).sort((a,b)=>(b.me-a.me)||a.display.localeCompare(b.display));
  const pts=order.map(x=>{const m=x.available?x.members.find(m=>m.key===trendKey):null;return{label:x.label,avail:x.available,v:m?m.damage:null,hits:m?m.hits:0}});
  const W=520,H=210,pl=46,pr=30,pt=14,pb=28;
  const vals=pts.filter(p=>p.v!=null).map(p=>p.v);const ymax=Math.max(...vals,1)*1.15;
  const xs=i=>pl+(order.length===1?0:i*(W-pl-pr)/(order.length-1));const ys=v=>pt+(H-pt-pb)*(1-v/ymax);
  let path="",open=false;pts.forEach((p,i)=>{if(p.v==null){open=false;return}path+=(open?"L":"M")+xs(i).toFixed(1)+","+ys(p.v).toFixed(1);open=true});
  const grid=[0,.25,.5,.75,1].map(f=>{const v=ymax*f,y=ys(v);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#2a303c"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}).join("");
  const dots=pts.map((p,i)=>`<text x="${xs(i)}" y="${H-8}" text-anchor="middle">${esc(p.label.replace("LIVE ","LIVE·"))}${p.avail?"":" (n/a)"}</text>`+(p.v!=null?`<circle cx="${xs(i)}" cy="${ys(p.v)}" r="5" fill="var(--accent)"><title>${esc(p.label)}: ${full(p.v)} (${p.hits} hits)</title></circle><text x="${xs(i)}" y="${ys(p.v)-10}" text-anchor="middle" style="fill:#e8ebf1;font-weight:700">${fmt(p.v)}</text>`:"")).join("");
  const all=allSeasons();const idx=all.indexOf(s);const prev=all.slice(idx+1).find(x=>x.available);
  let imp="";
  if(prev){const pm=Object.fromEntries(prev.members.map(m=>[m.key,m]));
    const d=s.members.filter(m=>m.hits&&pm[m.key]&&pm[m.key].damage&&pm[m.key].hits).map(m=>{const now=m.damage/m.hits,was=pm[m.key].damage/pm[m.key].hits;return {name:m.name,me:m.me,now,pct:(now/was-1)*100}}).sort((a,b)=>b.pct-a.pct);
    imp=`<h2 style="margin-top:16px">Most improved <small>${esc(s.label)} vs ${esc(prev.label)} average damage per hit</small></h2><ul class="imp">${d.slice(0,6).map(x=>`<li><span${x.me?' style="color:var(--me);font-weight:700"':""}>${esc(x.name)}${isLeader(x.name)?" <svg class='crown' viewBox='0 0 16 12' aria-label='leader'><path d='M1 3l3.5 3L8 1l3.5 5L15 3l-1.5 8h-11z' fill='currentColor'/></svg>":""}</span><span><span class="${x.pct>=0?"up":"down"}">${x.pct>=0?"+":""}${x.pct.toFixed(1)}%</span> <span class="muted">(${fmt(x.now)}/hit)</span></span></li>`).join("")}</ul><div class="note">Only members who hit Hard in both seasons. Ranked by growth in average damage per hit, the same rule as the Most Improved badge. Bosses differ each season, so it is a rough comparison.${s.live?" Live totals grow during the raid.":""}</div>`;
  } else imp=`<div class="note">No earlier season available to compare.</div>`;
  return `<div class="panel"><h2>Member trend <select id="trendSel">${opts.map(p=>`<option value="${p.key}" ${p.key===trendKey?"selected":""}>${esc(p.display)}</option>`).join("")}</select></h2>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Total Hard damage per season">${grid}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}</svg>
  <div class="note">Total Hard damage per season. Missing point = did not hit Hard that season.</div>${imp}</div>`;
}

let hlExpanded=false;const HL_MAX=12;
function hitsLeftData(s){
  const HPM=3;
  if(s.live&&s.allMembers){
    const list=s.roster.filter(m=>m.hitsLeft>0);
    return {list,total:s.feedHitsLeft!=null?s.feedHitsLeft:list.reduce((a,m)=>a+m.hitsLeft,0),unseen:0,mode:"live"};
  }
  const list=s.members.filter(m=>!m.former&&m.hits<HPM).map(m=>({...m,hitsLeft:HPM-m.hits}));
  if(s.live){ // older feed: only people who already hit are known
    const unseen=Math.max(0,Math.round(s.maxHits/HPM)-s.members.length);
    return {list,total:Math.max(0,s.maxHits-s.hitsUsed),unseen,mode:"live-old"};
  }
  // Members who missed every hit aren't in past raw data; add known misses by hand here.
  (MANUAL_MISSES[s.label]||[]).forEach(n=>{if(!list.some(m=>m.name===n)&&!s.members.some(m=>m.name===n))list.push({name:n,hits:0,hitsLeft:HPM,me:false});});
  return {list,total:list.reduce((a,m)=>a+m.hitsLeft,0),unseen:0,mode:"past"};
}
const MANUAL_MISSES={"S45":["SHABBY"]};
function hitsLeftPanel(s){
  const HPM=3,d=hitsLeftData(s);
  const list=[...d.list].sort((a,b)=>(b.hitsLeft-a.hitsLeft)||(b.me-a.me)||a.name.localeCompare(b.name));
  const nMem=list.length+d.unseen;

}

// ---- Boss status (like Blablalink's raid status screen) ----
// Hard Mode max HP per boss level. Bosses 1, 2, 4 = Lord class, 3 and 5 = Tyrant class; HP is the same
// every season. Levels 1-2 are re-derived below from killed levels (sum of damage on a killed level =
// its max HP) and match these exactly in S42-S45. Level 3 values match Blablalink's status screen.
// Level 4 = boss 5 only, effectively unkillable.
const HARD_HP={lord:{1:99856279200,2:149784418800,3:292445295750},tyrant:{1:150841813600,2:226262720400,3:349230901500,4:6984618030000}};
const HP_FINAL_LEVEL=step=>step===5?4:3;
const hpClass=step=>(step===3||step===5)?"tyrant":"lord";
const derivedHP={}; // "step|level" -> HP from killed levels (archived seasons, plus live when present)
function learnHP(prog){if(!prog)return;const g={};prog.forEach(h=>{const k=h.step+"|"+h.level;const x=g[k]||(g[k]={d:0,kill:false});x.d+=h.damage;x.kill=x.kill||h.kill});
  for(const k in g)if(g[k].kill&&!derivedHP[k])derivedHP[k]=g[k].d}
archived.forEach(a=>learnHP(a.prog));
const maxHP=(step,level)=>derivedHP[step+"|"+level]||(HARD_HP[hpClass(step)]||{})[level]||0;
function bossStatus(s){
  let rows=[];
  if(s.prog&&s.prog.length){
    learnHP(s.prog);
    const bosses={};s.prog.forEach(h=>{const b=bosses[h.boss]||(bosses[h.boss]={name:h.boss,step:h.step,element:h.element,lv:{}});
      const L=b.lv[h.level]||(b.lv[h.level]={d:0,kill:false});L.d+=h.damage;L.kill=L.kill||h.kill});
    const list=Object.values(bosses).sort((a,b)=>a.step-b.step);
    const top=b=>Math.max(...Object.keys(b.lv).map(Number));
    rows=list.map(b=>{let level=top(b);let L=b.lv[level];
      // the next level opens once every boss is dead on this level
      if(L.kill&&level<HP_FINAL_LEVEL(b.step)&&list.every(x=>x.lv[level]&&x.lv[level].kill)){level++;L=b.lv[level]||{d:0,kill:false}}
      return {name:b.name,step:b.step,element:b.element,level,dealt:L.d,killed:L.kill,est:false}});
  } else if(s.bosses&&s.bosses.length){
    // older live feed: only per-boss totals. Damage on the current level = total - HP of the (killed) lower levels.
    rows=s.bosses.map(b=>{const level=b.lap||1;let lower=0,ok=true;for(let l=1;l<level;l++){const hp=maxHP(b.step,l);if(!hp)ok=false;lower+=hp}
      return {name:b.name,step:b.step,element:b.element,level,dealt:ok?Math.max(0,b.damage-lower):b.damage,killed:b.kills>=level,est:true,lowerUnknown:!ok}}).sort((a,b)=>a.step-b.step);
  }
  rows.forEach(r=>{r.hp=r.lowerUnknown?0:maxHP(r.step,r.level);r.pct=r.hp?Math.min(100,r.dealt/r.hp*100):null;if(r.killed)r.pct=100});
  return rows;
}
const pctTxt=p=>Math.floor(p)+"%";
function statusPanel(s){
  const rows=bossStatus(s);

  if(!rows.length)return `<div class="panel bstat"><h2>Boss status · ${esc(s.label)} Hard <small>${title}</small></h2><div class="note">No Hard Mode hits yet.</div></div>`;
  const row=r=>{const col=ecol(r.element);const pill=r.element?`<span class="pill" style="background:${col}">${esc(r.element)}</span>`:"";
    const hpTxt=r.hp?`<b>${full(r.dealt)}</b>&nbsp;/&nbsp;${full(r.hp)}`:`<b>${full(r.dealt)}</b> dealt · max HP unknown`;
    const pc=r.killed?`<div class="pct killed">☠ Killed</div>`:`<div class="pct">${r.pct!=null?pctTxt(r.pct):"—"}</div>`;
    return `<div class="brow${r.killed?" dead":""}" title="${esc(r.name)} · Level ${r.level}${r.hp?" · "+(r.dealt/r.hp*100).toFixed(2)+"%":""}"><div class="nm">${esc(r.name)} ${pill}<span class="lv">Level ${r.level}</span></div>
      <div class="hp">${hpTxt}</div><div class="btrack">${r.pct!=null?`<div class="bfill" style="width:${r.pct.toFixed(2)}%"></div>`:""}</div>${pc}</div>`};
  const est=rows.some(r=>r.est);
  const note=`${s.live?"Damage on each boss's current level, updated every minute. ":"Where each boss stood when the season ended. "}Max HP is the same every season for each boss slot and level (bosses 3 and 5 have more HP).${est?" Estimated from boss totals until the tracker script update.":""}`;
  return `<div class="panel bstat" style="margin-bottom:14px"><h2><span>Boss status · ${esc(s.label)} Hard <small>${title}</small></span><button class="btn" id="bsCopy" title="Copy a short status for chat">Copy status</button></h2>

function copyStatus(s){

  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();

}

// ---- Progress tab: hits sent into each boss, per boss level ----
let view=/progress/i.test(location.hash)?"progress":/rank/i.test(location.hash)?"rank":"results";
const progLevel={},progPicked={}; // season id -> selected level / user picked it
function progressView(s){
  if(!s.prog){
    return `<div class="panel"><h2>Progress · ${esc(s.label)}</h2><div class="note" style="font-size:13.5px">Live progress appears after the tracker script update. The Results tab and Hits left already work.</div></div>`;
  }
  const levels=[...new Set(s.prog.map(h=>h.level))].filter(x=>x>0).sort((a,b)=>a-b);
  if(!levels.length)return `<div class="panel"><h2>Progress · ${esc(s.label)}</h2><div class="note">No Hard Mode hits yet.</div></div>`;
  let lv=progLevel[s.id];
  if(!levels.includes(lv)||(s.live&&!progPicked[s.id]))lv=s.live?levels[levels.length-1]:levels[0];
  progLevel[s.id]=lv;
  const atLv=s.prog.filter(h=>h.level===lv);
  // every boss of the season, in boss order (bosses not reached at this level still get a card)
  const bossList={};s.prog.forEach(h=>{if(!bossList[h.boss])bossList[h.boss]={name:h.boss,step:h.step,element:h.element}});
  const bosses=Object.values(bossList).sort((a,b)=>a.step-b.step);
  const kills=atLv.filter(h=>h.kill).length,dmg=atLv.reduce((a,h)=>a+h.damage,0);
  const lvBtn=l=>{const n=s.prog.filter(h=>h.level===l).length;return `<button data-l="${l}" class="${l===lv?"on":""}">Level ${l}<small>${n} hit${n===1?"":"s"}</small></button>`};
  const head=`<div class="panel"><h2>Progress · ${esc(s.label)} Hard <small>attacks sent into each boss, per boss level</small></h2>
    <div class="lvls">${levels.map(lvBtn).join("")}</div>
    <div class="prog-sum"><span>Level ${lv}: <b>${atLv.length}</b> hits</span><span><b title="${full(dmg)}">${fmt(dmg)}</b> damage</span><span><b>${kills}</b> / ${bosses.length} bosses killed</span></div></div>`;
  const card=b=>{
    const hs=atLv.filter(h=>h.boss===b.name);const col=ecol(b.element);
    const pill=b.element?` <span class="pill" style="background:${col}">${esc(b.element)}</span>`:"";
    if(!hs.length)return `<div class="panel pcard empty"><h3>${esc(b.name)}${pill}<span class="st">Boss ${b.step}</span></h3><div class="note">Not reached at Level ${lv}${s.live?" yet":""}.</div></div>`;
    const tot=hs.reduce((a,h)=>a+h.damage,0)||1;const killed=hs.some(h=>h.kill);
    const big=hs.reduce((a,h)=>h.damage>a.damage?h:a,hs[0]);
    const seg=hs.map((h,i)=>{const pct=h.damage/tot*100;const op=(i%2?0.72:1);
      return `<span class="${h.kill?"k":""}" style="width:${pct.toFixed(2)}%;background:${col};opacity:${op}" title="#${i+1} ${esc(h.name)}: ${full(h.damage)} (${pct.toFixed(1)}%)${h.kill?" · Kill":""}">${pct>=11?esc(h.name):""}</span>`}).join("");
    const status=killed?`<span class="killed">☠ Killed</span>`:(s.live?`<span class="ip">In progress</span>`:`<span class="alive">Not killed</span>`);
    const rows=hs.map((h,i)=>`<tr class="${h.me?"me":""} ${h.kill?"krow":""}"><td class="n">${i+1}</td><td class="l" title="${esc(h.name)}">${esc(h.name)}${isLeader(h.name)?" <svg class='crown' viewBox='0 0 16 12' aria-label='leader'><path d='M1 3l3.5 3L8 1l3.5 5L15 3l-1.5 8h-11z' fill='currentColor'/></svg>":""}${h.kill?'<span class="kill">☠ Kill</span>':""}</td><td title="${full(h.damage)}">${fmt(h.damage)}</td><td class="muted">${(h.damage/tot*100).toFixed(1)}%</td></tr>`).join("");
    return `<div class="panel pcard"><h3>${esc(b.name)}${pill}<span class="st">Boss ${b.step} · Level ${lv}</span><span class="tot" title="${full(tot)}">${fmt(tot)}</span></h3>
      <div class="stack" role="img" aria-label="Damage share per hit">${seg}</div>
      <div class="psum"><span><b>${hs.length}</b> hit${hs.length===1?"":"s"}</span>${status}<span>Biggest: <b>${esc(big.name)}</b> ${fmt(big.damage)}</span></div>
      <table class="plist"><tbody>${rows}</tbody></table></div>`;
  };
  const note=`<div class="note" style="margin-top:12px">Hits are listed in the order they landed${s.live?" (live tracker order)":""}. ${s.live?"":"Archived rows have no hit time, so the order comes from the raw rows, which are stored newest first (each boss level's killing hit is always the first row); the list shows them reversed, oldest first. "}Percent = share of that boss's damage at this level. ☠ Kill = final hit.</div>`;
  return head+`<div class="prog">${bosses.map(card).join("")}</div>`+note;
}

// ---- Union rank history tab: final union rank per season (lower is better) ----
function rankView(){
  const all=allSeasons().slice().reverse(); // oldest -> newest
  const rows=all.map(x=>({label:x.label,r:UNION_RANKS[x.label],s:x})).filter(x=>x.r);
  if(!rows.length)return `<div class="panel"><h2>Union rank history</h2><div class="note">No ranks added yet.</div></div>`;
  const ranks=rows.map(x=>x.r.rank),best=Math.min(...ranks),worst=Math.max(...ranks);
  const lo=Math.max(1,Math.floor((best-8)/10)*10),hi=Math.ceil((worst+8)/10)*10;
  const sm=window.innerWidth<600,W=sm?360:640,H=sm?250:260,pl=sm?48:52,pr=sm?22:26,pt=28,pb=34,n=rows.length;
  const X=i=>n===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(n-1),Y=r=>pt+(r-lo)*(H-pt-pb)/(hi-lo);
  let grid="";for(let v=lo;v<=hi;v+=10)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" class="rk-ax">#${v}</text>`;
  const pts=rows.map((x,i)=>`${X(i)},${Y(x.r.rank)}`).join(" ");
  const dots=rows.map((x,i)=>{const b=x.r.rank===best;return `<circle cx="${X(i)}" cy="${Y(x.r.rank)}" r="${b?7:5}" fill="${b?"var(--accent)":"var(--bg,#0b0f14)"}" stroke="var(--accent)" stroke-width="2.5"/><text x="${X(i)}" y="${Y(x.r.rank)-12}" text-anchor="middle" class="rk-v">#${x.r.rank}</text><text x="${X(i)}" y="${H-12}" text-anchor="middle" class="rk-ax">${esc(x.label)}</text>`}).join("");
  const svg=`<svg class="rk-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Union rank by season">${grid}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
  const latest=rows[rows.length-1],prev=rows[rows.length-2];
  const chg=(a,b)=>{if(!b)return `<span class="muted">—</span>`;const d=b.r.rank-a.r.rank;return d>0?`<span class="rk-up">▲ ${d}</span>`:d<0?`<span class="rk-dn">▼ ${-d}</span>`:`<span class="muted">no change</span>`};
  const bestRow=rows.find(x=>x.r.rank===best);
  const cardsHtml=`<div class="cards rk-cards">
  <div class="card"><div class="k">Latest rank</div><div class="v">#${latest.r.rank}</div><div class="s">${esc(latest.label)}${prev?" · "+chg(latest,prev)+" vs "+esc(prev.label):""}</div></div>
  <div class="card"><div class="k">Best rank</div><div class="v">#${best}</div><div class="s">${esc(bestRow.label)}</div></div>
  <div class="card"><div class="k">Seasons ranked</div><div class="v">${rows.length}</div><div class="s">${esc(rows[0].label)} to ${esc(latest.label)}</div></div></div>`;
  const table=`<div class="tablewrap"><table><thead><tr><th>Season</th><th>Rank</th><th>Change</th><th>Damage</th></tr></thead><tbody>${rows.slice().reverse().map(x=>{const i=rows.indexOf(x);return `<tr><td><b>${esc(x.label)}</b></td><td><b>#${x.r.rank}</b>${x.r.note&&x.r.note!=="final rank"?`<div class="muted" style="font-size:11.5px;white-space:normal;max-width:120px;margin:0 auto">${esc(x.r.note)}</div>`:""}</td><td>${chg(x,rows[i-1])}</td><td>${x.s.available?fmt(x.s.total):"—"}</td></tr>`}).join("")}</tbody></table></div>`;
  return cardsHtml+`<div class="panel"><h2>Union rank history <small>final rank each season · higher on the chart is better</small></h2>${svg}</div><div class="panel" style="margin-top:14px"><h2>By season</h2>${table}</div>`;
}

// ---- polling: fetch first, JSONP fallback; any failure keeps the archived/last data ----
let useJsonp=false, inflight=false;
function jsonp(url){return new Promise((res,rej)=>{const cb="__liveFeed"+Date.now().toString(36);const sc=document.createElement("script");
  const done=()=>{delete window[cb];sc.remove();clearTimeout(t)};const t=setTimeout(()=>{done();rej(new Error("timeout"))},20000);
  window[cb]=d=>{done();res(d)};sc.onerror=()=>{done();rej(new Error("jsonp error"))};
  sc.src=url+(url.includes("?")?"&":"?")+"callback="+cb;document.head.appendChild(sc)})}
async function getFeed(){
  if(!useJsonp){
    try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),20000);
      const r=await fetch(LIVE_FEED_URL+(LIVE_FEED_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",redirect:"follow",signal:ctl.signal});clearTimeout(t);
      if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();
    }catch(e){useJsonp=true}
  }
  return jsonp(LIVE_FEED_URL);
}
async function poll(){
  if(!LIVE_FEED_URL||inflight)return;inflight=true;
  try{
    const feed=await getFeed();lastFetchOk=Date.now();
    const sig=JSON.stringify([feed&&feed.updatedAt,feed&&feed.totals,feed&&feed.people&&feed.people.length,feed&&feed.season,feed&&feed.live,
      feed&&Array.isArray(feed.people)?feed.people.map(p=>p&&p.name+":"+p.hits).join("|"):"",feed&&Array.isArray(feed.hits)?feed.hits.length:-1]);
    if(sig!==liveSig){
      liveSig=sig;const next=liveSeasonFrom(feed);const had=!!live;live=next;
      if(live&&!had&&!userPicked)cur="LIVE";
      const sel=document.activeElement;
      if(sel&&sel.id==="trendSel")setTimeout(render,1500); else render();
    }
  }catch(e){/* offline / blocked: keep showing archived (and last live) data */}
  finally{inflight=false;liveBadge()}
}
render();
if(LIVE_FEED_URL){poll();setInterval(poll,LIVE_POLL_MS);setInterval(liveBadge,1000);}
})();
</script>
