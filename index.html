<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SUBSONIC · Union Raid Dashboard</title>
<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d222c;--line:#2a303c;--text:#e8ebf1;--muted:#8d95a5;--accent:#1fd1c1;--accent2:#7ff0e4;--me:#40e0d0;
--Electric:#b980ff;--Fire:#ff5a4f;--Water:#3fa7ff;--Wind:#3ddc84;--Iron:#f2b33d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -200px,#082a28 0,transparent 60%),var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:22px;letter-spacing:.5px}
h1 .tag{color:var(--accent);font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.seasons{display:flex;gap:6px;flex-wrap:wrap}
.seasons button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:13px}
.seasons button.on{background:var(--accent);color:#04211e;border-color:var(--accent)}
.seasons button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.card .k{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.card .v{font-size:22px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}.grid>div,.side{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 small{color:var(--muted);font-weight:500;font-size:12px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overflow-y:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}
th.sorted{color:var(--accent2)}
th{position:sticky}th.sorted:after{content:"▾";position:absolute;margin-left:3px}th.sorted.asc:after{content:"▴"}
tbody tr:hover{background:#ffffff08}
tr.me td{background:#40e0d014}
tr.me td.name{color:var(--me);font-weight:700}
td.rank{color:var(--muted);width:32px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;color:#111}
.bar{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin-top:3px}
.boss{margin:10px 0 14px}
.boss .row1{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px}
.boss .row1 b{font-size:14px}
.boss .track{height:16px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:5px 0 3px}
.boss .fill{height:100%;border-radius:6px}
.boss .meta{color:var(--muted);font-size:12px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;max-width:100%}
svg text{fill:var(--muted);font-size:11px}
.imp{list-style:none;margin:8px 0 0;padding:0}
.imp li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.imp .up{color:#3ddc84;font-weight:700}.imp .down{color:#ff6b6b;font-weight:700}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin-top:6px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.livebadge{font-size:12px;color:#3ddc84;background:#3ddc8414;border:1px solid #3ddc8455;border-radius:999px;padding:3px 10px;white-space:nowrap}
.livebadge.stale{color:var(--muted);border-color:var(--line);background:transparent}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b3b;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 #ff3b3b88;animation:pulse 1.6s infinite}
.livebadge .dot{background:#3ddc84;box-shadow:none}
.seasons button.livebtn{border-color:#ff3b3b88}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff3b3b88}70%{box-shadow:0 0 0 7px #ff3b3b00}100%{box-shadow:0 0 0 0 #ff3b3b00}}
@media (max-width:600px){.hdr-right{align-items:flex-start}}
.hl{margin-bottom:14px}
.hl .sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:-2px 0 10px}
.hl .big{font-size:26px;font-weight:800;color:var(--accent2);line-height:1}
.hl .big.done{color:#3ddc84}
.hl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.hl-item{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid #ff6b6b;border-radius:8px;padding:7px 10px;min-width:0}
.hl-item.l2{border-left-color:var(--accent)}.hl-item.l1{border-left-color:var(--accent2)}
.hl-item.me{background:#40e0d014}.hl-item.me .hl-name{color:var(--me);font-weight:700}
.hl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pips{display:inline-flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.hl-n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;flex:none;min-width:26px;text-align:right}
.hl-done{padding:14px;text-align:center;font-size:16px;font-weight:700;color:#3ddc84;background:#3ddc8410;border:1px dashed #3ddc8455;border-radius:10px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.hl .more{margin-top:8px}
@media (max-width:480px){.hl-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.hl-item{padding:6px 8px;gap:6px}.pips i{width:8px;height:8px}.hl .big{font-size:22px}}
.views{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.views button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;font-size:14px;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.views button.on{color:var(--accent2);border-bottom-color:var(--accent)}
.views button:hover{color:var(--text)}
.lvls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lvls button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px}
.lvls button.on{background:var(--accent);color:#04211e;border-color:var(--accent)}
.lvls button small{font-weight:500;opacity:.75;margin-left:4px}
.prog-sum{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12.5px;margin-top:10px}
.prog-sum b{color:var(--text)}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:14px}
.pcard h3{margin:0 0 8px;font-size:14.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pcard h3 .st{color:var(--muted);font-weight:500;font-size:12px}
.pcard h3 .tot{margin-left:auto;font-variant-numeric:tabular-nums}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--panel2);margin:2px 0 8px}
.stack span{display:block;height:100%;border-right:1px solid #0d0f14;min-width:2px;overflow:hidden;white-space:nowrap;font-size:10.5px;line-height:22px;color:#0d0f14;font-weight:700;padding:0 0 0 4px}
.stack span:last-child{border-right:0}
.stack span.k{box-shadow:inset 0 0 0 2px #fff}
.psum{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.psum b{color:var(--text)}
.psum .killed{color:#3ddc84;font-weight:700}.psum .alive{color:#ff6b6b;font-weight:700}.psum .ip{color:var(--accent2);font-weight:700}
.plist{width:100%;font-size:13px}
.plist td{padding:5px 6px;text-align:right}
.plist td.n{color:var(--muted);width:26px;text-align:left}
.plist td.l{text-align:left;max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis}
.plist tr.me td.l{color:var(--me);font-weight:700}
.plist tr.krow td{background:#ff5a4f12}
.kill{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:#ff5a4f;color:#1a0503;font-size:10.5px;font-weight:800;vertical-align:1px}
.pcard.empty{opacity:.6}
@media (max-width:480px){.prog{grid-template-columns:minmax(0,1fr)}.lvls button{padding:6px 10px}.views button{flex:1}}
.bstat .rows{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.brow .nm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:14px}
.brow .nm .lv{color:var(--muted);font-weight:600;font-size:12px}
.brow .pct{grid-column:2;grid-row:1;font-size:22px;font-weight:800;color:var(--accent2);text-align:right;line-height:1.1;font-variant-numeric:tabular-nums}
.brow .pct.killed{color:#3ddc84;font-size:16px}
.brow .hp{grid-column:1/-1;display:flex;justify-content:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .hp b{color:var(--text);font-weight:600}
.brow .btrack{grid-column:1/-1;height:8px;border-radius:5px;background:#2a303c;overflow:hidden}
.brow .bfill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.brow.dead{opacity:.75}.brow.dead .bfill{background:#3ddc84}
@media (min-width:760px){.brow{grid-template-columns:minmax(0,1fr) minmax(220px,300px) 70px;grid-template-rows:auto auto}
 .brow .nm{grid-row:1/3}.brow .hp{grid-column:2;grid-row:1}.brow .btrack{grid-column:2;grid-row:2}.brow .pct{grid-column:3;grid-row:1/3}}
@media (max-width:480px){.brow{padding:8px 10px}.brow .pct{font-size:19px}.brow .hp{font-size:11px}}
footer{color:var(--muted);font-size:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.unavail{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.tablewrap{max-height:70vh}.cards{grid-template-columns:repeat(2,1fr)}.cards .card:last-child{grid-column:span 2}}
@media (max-width:480px){h1{font-size:19px}.card .v{font-size:19px}th,td{padding:6px 6px;font-size:12.5px}.wrap{padding:14px 10px 30px}}
</style>
</head>

<script>
/* ===== LIVE FEED (Apps Script doGet; read-only, anonymized). Set to "" to disable. ===== */
const LIVE_FEED_URL = "https://script.google.com/macros/s/AKfycbw-_nz0Ya0j9SPJQtCS1g1WY-pqQf0lHvZ10C2g84mlBUnRktFv0mM18qcZ5AZtnrk-/exec";
const LIVE_POLL_MS = 60000, LIVE_FRESH_MS = 3*3600*1000;
</script>
<script>
(function(){
"use strict";
const ELEMS=["Electric","Fire","Water","Wind","Iron"];
const F=DATA.meta.hitFields; const I=Object.fromEntries(F.map((f,i)=>[f,i]));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{const a=Math.abs(n);if(a>=1e12)return(n/1e12).toFixed(2)+"T";if(a>=1e9)return(n/1e9).toFixed(a>=1e11?1:2)+"B";if(a>=1e6)return(n/1e6).toFixed(1)+"M";return Math.round(n).toLocaleString()};
const full=n=>Math.round(n).toLocaleString("en-US");
const ecol=e=>`var(--${ELEMS.includes(e)?e:"accent"})`;
const ago=ms=>{const s=Math.max(0,Math.round(ms/1000));if(s<90)return s+"s";const m=Math.round(s/60);if(m<90)return m+"m";return Math.round(m/60)+"h"};

// people + display names (disambiguate duplicate names)
const people={};const nameCount={};
DATA.people.forEach(p=>{nameCount[p.name]=(nameCount[p.name]||0)+1});
const seen={};
DATA.people.forEach(p=>{let d=p.name;if(nameCount[p.name]>1){seen[p.name]=(seen[p.name]||0)+1;d=p.name+" #"+seen[p.name]}people[p.key]={...p,display:d}});
// name -> archived key (only when the name is unique), used to link live rows to history
const keyByName={};DATA.people.forEach(p=>{if(nameCount[p.name]===1)keyByName[p.name.toUpperCase()]=p.key});

const finish=m=>({...m,avg:m.hits?m.damage/m.hits:0,perSync:m.synchro?m.damage/m.synchro:0});
// aggregate each archived season
const archived=DATA.seasons.map(s=>{
  const out={...s,id:"S"+s.season,label:"S"+s.season,members:[],bosses:[],total:0,hitsUsed:0,kills:0};
  if(!s.available)return out;
  const m={},b={};
  s.hits.forEach(h=>{
    const k=h[I.person],dmg=h[I.damage];
    const x=m[k]||(m[k]={key:k,name:people[k]?people[k].display:k,me:!!(people[k]&&people[k].me),synchro:0,hits:0,damage:0,kills:0});
    x.synchro=Math.max(x.synchro,h[I.synchro]);x.hits++;x.damage+=dmg;x.kills+=h[I.finalHit]?1:0;
    const bn=h[I.boss];
    const y=b[bn]||(b[bn]={name:bn,step:h[I.step],element:h[I.element],weak:(s.weak||{})[bn]||"",hits:0,damage:0,kills:0,lap:0});
    y.hits++;y.damage+=dmg;y.kills+=h[I.finalHit]?1:0;y.lap=Math.max(y.lap,h[I.lap]);
    out.total+=dmg;out.hitsUsed++;out.kills+=h[I.finalHit]?1:0;
  });
  out.members=Object.values(m).map(finish);
  out.bosses=Object.values(b).sort((a,c)=>a.step-c.step);
  // Progress tab: Hard hits oldest -> newest. Archived rows have no hit_time; the raw rows are stored
  // newest-first (every boss level's killing hit is the first row of its group), so reverse them.
  out.prog=s.hits.slice().reverse().map(h=>{const k=h[I.person];return{name:people[k]?people[k].display:k,me:!!(people[k]&&people[k].me),
    boss:h[I.boss],step:h[I.step],element:h[I.element],level:h[I.lap],damage:h[I.damage],kill:!!h[I.finalHit]}});
  return out;
});
const archivedNums=new Set(archived.filter(s=>s.available).map(s=>s.season));

// ---- live season (from the feed) ----
let live=null, liveSig="", lastFetchOk=0, userPicked=false;
function liveSeasonFrom(feed){
  if(!feed||feed.ok!==true||!feed.live||!Array.isArray(feed.people)||!feed.people.length)return null;
  const HPM=3;
  const upd=feed.updatedAt?Date.parse(feed.updatedAt):0;
  const fresh=upd&&(Date.now()-upd)<LIVE_FRESH_MS;
  const isNew=!(feed.season&&archivedNums.has(feed.season));
  if(!isNew&&!fresh)return null;
  const everyone=feed.people.map(p=>{
    const k=(!p.me&&keyByName[String(p.name).toUpperCase()])||(p.me&&(DATA.people.find(x=>x.me)||{}).key)||("live:"+p.key);
    const hits=+p.hits||0;
    return finish({key:k,name:people[k]?people[k].display:String(p.name),me:!!p.me,synchro:+p.synchro||0,hits,damage:+p.damage||0,kills:+p.kills||0,
      former:!!p.former,hitsLeft:p.hitsLeft!=null?Math.max(0,+p.hitsLeft||0):Math.max(0,HPM-hits)});
  });
  // v2 feeds (allMembers) also list current members with 0 hits; the leaderboard only shows hitters.
  const members=everyone.filter(m=>m.hits>0);
  const allMembers=feed.allMembers===true;
  const t=feed.totals||{};
  // v3 feeds carry hits[] (oldest -> newest); older feeds don't, so Progress shows a note instead.
  const byKey={};feed.people.forEach((p,i)=>{byKey[p.key]=everyone[i]});
  const elOf={};(feed.bosses||[]).forEach(b=>{elOf[String(b.name)]=String(b.element||"")});
  const prog=Array.isArray(feed.hits)?feed.hits.map(h=>{const m=byKey[h.key]||{name:"?",me:false};const bn=String(h.boss||"");
    return{name:m.name,me:!!m.me,boss:bn,step:+h.step||0,element:elOf[bn]||"",level:+h.level||0,damage:+h.damage||0,kill:!!h.kill}}):null;
  return {id:"LIVE",prog,label:"LIVE"+(feed.season?" S"+feed.season:""),live:true,available:true,season:feed.season||null,
    updatedAt:feed.updatedAt,maxHits:+feed.maxHits||96,members,allMembers,
    roster:allMembers?everyone.filter(m=>!m.former):null,feedHitsLeft:feed.hitsLeft!=null?+feed.hitsLeft||0:null,
    bosses:(feed.bosses||[]).map(b=>({name:String(b.name),step:+b.step||0,element:String(b.element||""),weak:String(b.weak||""),hits:+b.hits||0,damage:+b.damage||0,kills:+b.kills||0,lap:+b.lap||0})),
    total:+t.damage||0,hitsUsed:+t.hits||0,kills:+t.kills||0};
}
const allSeasons=()=>live?[live,...archived]:archived;
const byId=id=>allSeasons().find(s=>s.id===id);

let cur=(archived.find(s=>s.available)||archived[0]).id;
let sortKey="damage",sortAsc=false;
let trendKey=(DATA.people.find(p=>p.me)||DATA.people[0]||{}).key;

function renderSeasons(){
  $("#seasons").innerHTML=allSeasons().map(s=>`<button data-s="${s.id}" class="${s.id===cur?"on":""} ${s.live?"livebtn":""}" ${s.available?"":"disabled title='"+esc(s.note||"No data")+"'"}>${s.live?'<span class="dot"></span>':""}${esc(s.label)}</button>`).join("");
  document.querySelectorAll("#seasons button").forEach(b=>b.onclick=()=>{cur=b.dataset.s;userPicked=true;render()});
}

function cards(s){
  const top=[...s.members].sort((a,b)=>b.damage-a.damage)[0];
  const avg=s.hitsUsed?s.total/s.hitsUsed:0;
  return `<div class="cards">
  <div class="card"><div class="k">Total Hard damage</div><div class="v" title="${full(s.total)}">${fmt(s.total)}</div><div class="s">${full(s.total)}</div></div>
  <div class="card"><div class="k">Hits used</div><div class="v">${s.hitsUsed} / ${s.maxHits}</div><div class="s">${Math.max(0,s.maxHits-s.hitsUsed)} unused · ${s.members.length} hitters</div></div>
  <div class="card"><div class="k">Boss kills</div><div class="v">${s.kills}</div><div class="s">final hits on Hard</div></div>
  <div class="card"><div class="k">Avg damage / hit</div><div class="v">${fmt(avg)}</div><div class="s">${full(avg)}</div></div>
  <div class="card"><div class="k">Top hitter</div><div class="v">${top?esc(top.name):"—"}</div><div class="s">${top?fmt(top.damage)+" in "+top.hits+" hits":""}</div></div>
  </div>`;
}

const COLS=[["rank","#","l"],["name","Name","l"],["synchro","Synchro"],["hits","Hits"],["damage","Total dmg"],["avg","Avg / hit"],["perSync","Dmg / synchro"],["kills","Kills"]];
function leaderboard(s){
  const ranked=[...s.members].sort((a,b)=>b.damage-a.damage);ranked.forEach((m,i)=>m.rank=i+1);
  const max=ranked.length?ranked[0].damage:1;
  const rows=[...ranked].sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(typeof x==="string"){x=x.toLowerCase();y=y.toLowerCase();return sortAsc?(x<y?-1:x>y?1:0):(x<y?1:x>y?-1:0)}return sortAsc?x-y:y-x});
  return `<div class="panel"><h2>Leaderboard · ${esc(s.label)} Hard <small>tap a header to sort · ★ = you</small></h2><div class="tablewrap"><table><thead><tr>${COLS.map(c=>`<th data-k="${c[0]}" class="${c[2]||""} ${sortKey===c[0]?"sorted"+(sortAsc?" asc":""):""}">${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(m=>`<tr class="${m.me?"me":""}"><td class="rank l">${m.rank}</td><td class="l name">${esc(m.name)}${m.me?" ★":""}<div class="bar" style="width:${(m.damage/max*100).toFixed(1)}%"></div></td><td>${m.synchro}</td><td>${m.hits}</td><td title="${full(m.damage)}">${fmt(m.damage)}</td><td title="${full(m.avg)}">${fmt(m.avg)}</td><td title="${full(m.perSync)}">${fmt(m.perSync)}</td><td>${m.kills||""}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function bossPanel(s){
  const max=Math.max(...s.bosses.map(b=>b.damage),1);

}

function trendPanel(s){

  const W=520,H=210,pl=46,pr=30,pt=14,pb=28;
  const vals=pts.filter(p=>p.v!=null).map(p=>p.v);const ymax=Math.max(...vals,1)*1.15;

  const grid=[0,.25,.5,.75,1].map(f=>{const v=ymax*f,y=ys(v);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#2a303c"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}).join("");

    const d=s.members.filter(m=>pm[m.key]&&pm[m.key].damage).map(m=>({name:m.name,me:m.me,diff:m.damage-pm[m.key].damage,pct:(m.damage/pm[m.key].damage-1)*100})).sort((a,b)=>b.diff-a.diff);
    imp=`<h2 style="margin-top:16px">Most improved <small>${esc(s.label)} vs ${esc(prev.label)} total Hard damage</small></h2><ul class="imp">${d.slice(0,6).map(x=>`<li><span${x.me?' style="color:var(--me);font-weight:700"':""}>${esc(x.name)}${x.me?" ★":""}</span><span><span class="${x.diff>=0?"up":"down"}">${x.diff>=0?"+":""}${fmt(x.diff)}</span> <span class="muted">(${x.pct>=0?"+":""}${x.pct.toFixed(0)}%)</span></span></li>`).join("")}</ul><div class="note">Only members who hit Hard in both seasons. Bosses differ each season, so raw totals are a rough comparison.${s.live?" Live totals grow during the raid.":""}</div>`;
  } else imp=`<div class="note">No earlier season available to compare.</div>`;
  return `<div class="panel"><h2>Member trend <select id="trendSel">${opts.map(p=>`<option value="${p.key}" ${p.key===trendKey?"selected":""}>${esc(p.display)}${p.me?" ★":""}</option>`).join("")}</select></h2>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Total Hard damage per season">${grid}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}</svg>
  <div class="note">Total Hard damage per season. Missing point = did not hit Hard that season.</div>${imp}</div>`;
}

// ---- Hits left: who still has attacks to do ----
let hlExpanded=false;const HL_MAX=12;
function hitsLeftData(s){
  const HPM=3;
  if(s.live&&s.allMembers){
    const list=s.roster.filter(m=>m.hitsLeft>0);
    return {list,total:s.feedHitsLeft!=null?s.feedHitsLeft:list.reduce((a,m)=>a+m.hitsLeft,0),unseen:0,mode:"live"};
  }
  const list=s.members.filter(m=>!m.former&&m.hits<HPM).map(m=>({...m,hitsLeft:HPM-m.hits}));
  if(s.live){ // older feed: only people who already hit are known
    const unseen=Math.max(0,Math.round(s.maxHits/HPM)-s.members.length);
    return {list,total:Math.max(0,s.maxHits-s.hitsUsed),unseen,mode:"live-old"};
  }
  // Members who missed every hit aren't in past raw data; add known misses by hand here.
  (MANUAL_MISSES[s.label]||[]).forEach(n=>{if(!list.some(m=>m.name===n)&&!s.members.some(m=>m.name===n))list.push({name:n,hits:0,hitsLeft:HPM,me:false});});
  return {list,total:list.reduce((a,m)=>a+m.hitsLeft,0),unseen:0,mode:"past"};
}
const MANUAL_MISSES={"S45":["SHABBY"]};
function hitsLeftPanel(s){
  const HPM=3,d=hitsLeftData(s);
  const list=[...d.list].sort((a,b)=>(b.hitsLeft-a.hitsLeft)||(b.me-a.me)||a.name.localeCompare(b.name));
  const nMem=list.length+d.unseen;
  const pips=h=>`<span class="pips" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i<h?"on":""}"></i>`).join("")}</span>`;
  const item=m=>`<div class="hl-item l${m.hitsLeft}${m.me?" me":""}" title="${esc(m.name)}: ${m.hits} of ${HPM} hits done · ${m.hitsLeft} left"><span class="hl-name">${esc(m.name)}${m.me?" ★":""}</span>${pips(m.hits)}<span class="hl-n">${m.hits}/${HPM}</span></div>`;
  const shown=hlExpanded?list:list.slice(0,HL_MAX);
  const title=s.live?`Hits left · ${esc(s.label)}`:`Unused hits · ${esc(s.label)}`;
  let body;
  if(!list.length&&!d.unseen){
    body=s.live?`<div class="hl-done">Everyone's done! 🎉 All hits are in.</div>`
               :`<div class="note">Everyone who hit this season used all ${HPM} hits.</div>`;
  } else {
    const sum=s.live
      ?`<div class="sum"><span class="big">${d.total}</span><span>hit${d.total===1?"":"s"} remaining · ${nMem} member${nMem===1?"":"s"} not finished</span></div>`
      :`<div class="sum"><span class="big">${d.total}</span><span>hit${d.total===1?"":"s"} unused by ${list.length} member${list.length===1?"":"s"} who hit fewer than ${HPM} times</span></div>`;
    body=sum+(list.length?`<div class="hl-list">${shown.map(item).join("")}</div>`:"")+
      (list.length>HL_MAX?`<div class="more"><button class="btn" id="hlMore">${hlExpanded?"Show fewer":"Show all "+list.length}</button></div>`:"");
  }
  let note="";
  if(d.mode==="live")note=!list.length?"":`Every current member with fewer than ${HPM} Hard hits, most hits left first. Updates every minute.`;
  else if(d.mode==="live-old")note=d.unseen?`${d.unseen} member${d.unseen===1?" hasn't":"s haven't"} hit yet and aren't listed by name until the tracker script is updated.`:`Members who haven't hit at all aren't listed until the tracker script is updated.`;
  else note=`Past-season data only includes members who hit at least once, so anyone who never hit is only listed if added by hand. ${Math.max(0,s.maxHits-s.hitsUsed)} of ${s.maxHits} hits went unused overall.`;
  const copy=list.length?`<button class="btn" id="hlCopy" title="Copy the list to paste in chat">Copy list</button>`:"";
  return `<div class="panel hl"><h2><span>${title}</span><span style="display:flex;gap:8px;align-items:center"><small>● = hit done</small>${copy}</span></h2>${body}${note?`<div class="note">${note}</div>`:""}</div>`;
}
function copyHitsLeft(s){
  const d=hitsLeftData(s);const list=[...d.list].sort((a,b)=>(b.hitsLeft-a.hitsLeft)||a.name.localeCompare(b.name));
  const txt=`${s.label} Hard – hits left (${d.total}):\n`+list.map(m=>`${m.name} ${m.hits}/3`).join("\n")+(d.unseen?`\n+${d.unseen} who haven't hit yet`:"");
  const ok=()=>{const b=$("#hlCopy");if(b){b.textContent="Copied!";setTimeout(()=>{const c=$("#hlCopy");if(c)c.textContent="Copy list"},1500)}};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){}ta.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();

// ---- Boss status (like Blablalink's raid status screen) ----
// Hard Mode max HP per boss level. Bosses 1, 2, 4 = Lord class, 3 and 5 = Tyrant class; HP is the same
// every season. Levels 1-2 are re-derived below from killed levels (sum of damage on a killed level =
// its max HP) and match these exactly in S42-S45. Level 3 values match Blablalink's status screen.
// Level 4 = boss 5 only, effectively unkillable.
const HARD_HP={lord:{1:99856279200,2:149784418800,3:292445295750},tyrant:{1:150841813600,2:226262720400,3:349230901500,4:6984618030000}};
const HP_FINAL_LEVEL=step=>step===5?4:3;
const hpClass=step=>(step===3||step===5)?"tyrant":"lord";
const derivedHP={}; // "step|level" -> HP from killed levels (archived seasons, plus live when present)
function learnHP(prog){if(!prog)return;const g={};prog.forEach(h=>{const k=h.step+"|"+h.level;const x=g[k]||(g[k]={d:0,kill:false});x.d+=h.damage;x.kill=x.kill||h.kill});
  for(const k in g)if(g[k].kill&&!derivedHP[k])derivedHP[k]=g[k].d}
archived.forEach(a=>learnHP(a.prog));
const maxHP=(step,level)=>derivedHP[step+"|"+level]||(HARD_HP[hpClass(step)]||{})[level]||0;
function bossStatus(s){
  let rows=[];
  if(s.prog&&s.prog.length){
    learnHP(s.prog);
    const bosses={};s.prog.forEach(h=>{const b=bosses[h.boss]||(bosses[h.boss]={name:h.boss,step:h.step,element:h.element,lv:{}});
      const L=b.lv[h.level]||(b.lv[h.level]={d:0,kill:false});L.d+=h.damage;L.kill=L.kill||h.kill});
    const list=Object.values(bosses).sort((a,b)=>a.step-b.step);
    const top=b=>Math.max(...Object.keys(b.lv).map(Number));
    rows=list.map(b=>{let level=top(b);let L=b.lv[level];
      // the next level opens once every boss is dead on this level
      if(L.kill&&level<HP_FINAL_LEVEL(b.step)&&list.every(x=>x.lv[level]&&x.lv[level].kill)){level++;L=b.lv[level]||{d:0,kill:false}}
      return {name:b.name,step:b.step,element:b.element,level,dealt:L.d,killed:L.kill,est:false}});
  } else if(s.bosses&&s.bosses.length){
    // older live feed: only per-boss totals. Damage on the current level = total - HP of the (killed) lower levels.
    rows=s.bosses.map(b=>{const level=b.lap||1;let lower=0,ok=true;for(let l=1;l<level;l++){const hp=maxHP(b.step,l);if(!hp)ok=false;lower+=hp}
      return {name:b.name,step:b.step,element:b.element,level,dealt:ok?Math.max(0,b.damage-lower):b.damage,killed:b.kills>=level,est:true,lowerUnknown:!ok}}).sort((a,b)=>a.step-b.step);
  }
  rows.forEach(r=>{r.hp=r.lowerUnknown?0:maxHP(r.step,r.level);r.pct=r.hp?Math.min(100,r.dealt/r.hp*100):null;if(r.killed)r.pct=100});
  return rows;
}
const pctTxt=p=>Math.floor(p)+"%";
function statusPanel(s){
  const rows=bossStatus(s);
  const title=s.live?"Current status":"Final status";
  if(!rows.length)return `<div class="panel bstat"><h2>Boss status · ${esc(s.label)} Hard <small>${title}</small></h2><div class="note">No Hard Mode hits yet.</div></div>`;
  const row=r=>{const col=ecol(r.element);const pill=r.element?`<span class="pill" style="background:${col}">${esc(r.element)}</span>`:"";
    const hpTxt=r.hp?`<b>${full(r.dealt)}</b>&nbsp;/&nbsp;${full(r.hp)}`:`<b>${full(r.dealt)}</b> dealt · max HP unknown`;
    const pc=r.killed?`<div class="pct killed">☠ Killed</div>`:`<div class="pct">${r.pct!=null?pctTxt(r.pct):"—"}</div>`;
    return `<div class="brow${r.killed?" dead":""}" title="${esc(r.name)} · Level ${r.level}${r.hp?" · "+(r.dealt/r.hp*100).toFixed(2)+"%":""}"><div class="nm">${esc(r.name)} ${pill}<span class="lv">Level ${r.level}</span></div>
      <div class="hp">${hpTxt}</div><div class="btrack">${r.pct!=null?`<div class="bfill" style="width:${r.pct.toFixed(2)}%"></div>`:""}</div>${pc}</div>`};
  const est=rows.some(r=>r.est);
  const note=`${s.live?"Damage on each boss's current level, updated every minute. ":"Where each boss stood when the season ended. "}Max HP is the same every season for each boss slot and level (bosses 3 and 5 have more HP).${est?" Estimated from boss totals until the tracker script update.":""}`;
  return `<div class="panel bstat" style="margin-bottom:14px"><h2><span>Boss status · ${esc(s.label)} Hard <small>${title}</small></span><button class="btn" id="bsCopy" title="Copy a short status for chat">Copy status</button></h2>
    <div class="rows">${rows.map(row).join("")}</div><div class="note">${note}</div></div>`;
}
function copyStatus(s){
  const rows=bossStatus(s);
  const txt=`${s.label} Hard ${s.live?"status":"final status"}: `+rows.map(r=>`${r.name} L${r.level} ${r.killed?"☠ Killed":(r.pct!=null?pctTxt(r.pct):fmt(r.dealt)+" dmg")}`).join(" · ");
  const ok=()=>{const b=$("#bsCopy");if(b){b.textContent="Copied!";setTimeout(()=>{const c=$("#bsCopy");if(c)c.textContent="Copy status"},1500)}};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){}ta.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();

}
window.__statusText=()=>{const s=byId(cur);return s?bossStatus(s).map(r=>`${r.name} L${r.level} ${r.killed?"Killed":r.pct!=null?pctTxt(r.pct):"?"}`).join(" · "):""};

// ---- Progress tab: hits sent into each boss, per boss level ----
let view=/progress/i.test(location.hash)?"progress":"results";
const progLevel={},progPicked={}; // season id -> selected level / user picked it
function progressView(s){
  if(!s.prog){
    return `<div class="panel"><h2>Progress · ${esc(s.label)}</h2><div class="note" style="font-size:13.5px">Live progress appears after the tracker script update. The Results tab and Hits left already work.</div></div>`;
  }
  const levels=[...new Set(s.prog.map(h=>h.level))].filter(x=>x>0).sort((a,b)=>a-b);
  if(!levels.length)return `<div class="panel"><h2>Progress · ${esc(s.label)}</h2><div class="note">No Hard Mode hits yet.</div></div>`;
  let lv=progLevel[s.id];
  if(!levels.includes(lv)||(s.live&&!progPicked[s.id]))lv=s.live?levels[levels.length-1]:levels[0];
  progLevel[s.id]=lv;
  const atLv=s.prog.filter(h=>h.level===lv);
  // every boss of the season, in boss order (bosses not reached at this level still get a card)
  const bossList={};s.prog.forEach(h=>{if(!bossList[h.boss])bossList[h.boss]={name:h.boss,step:h.step,element:h.element}});
  const bosses=Object.values(bossList).sort((a,b)=>a.step-b.step);
  const kills=atLv.filter(h=>h.kill).length,dmg=atLv.reduce((a,h)=>a+h.damage,0);
  const lvBtn=l=>{const n=s.prog.filter(h=>h.level===l).length;return `<button data-l="${l}" class="${l===lv?"on":""}">Level ${l}<small>${n} hit${n===1?"":"s"}</small></button>`};
  const head=`<div class="panel"><h2>Progress · ${esc(s.label)} Hard <small>attacks sent into each boss, per boss level</small></h2>
    <div class="lvls">${levels.map(lvBtn).join("")}</div>
    <div class="prog-sum"><span>Level ${lv}: <b>${atLv.length}</b> hits</span><span><b title="${full(dmg)}">${fmt(dmg)}</b> damage</span><span><b>${kills}</b> / ${bosses.length} bosses killed</span></div></div>`;
  const card=b=>{
    const hs=atLv.filter(h=>h.boss===b.name);const col=ecol(b.element);
    const pill=b.element?` <span class="pill" style="background:${col}">${esc(b.element)}</span>`:"";
    if(!hs.length)return `<div class="panel pcard empty"><h3>${esc(b.name)}${pill}<span class="st">Boss ${b.step}</span></h3><div class="note">Not reached at Level ${lv}${s.live?" yet":""}.</div></div>`;
    const tot=hs.reduce((a,h)=>a+h.damage,0)||1;const killed=hs.some(h=>h.kill);
    const big=hs.reduce((a,h)=>h.damage>a.damage?h:a,hs[0]);
    const seg=hs.map((h,i)=>{const pct=h.damage/tot*100;const op=(i%2?0.72:1);
      return `<span class="${h.kill?"k":""}" style="width:${pct.toFixed(2)}%;background:${col};opacity:${op}" title="#${i+1} ${esc(h.name)}: ${full(h.damage)} (${pct.toFixed(1)}%)${h.kill?" · Kill":""}">${pct>=11?esc(h.name):""}</span>`}).join("");
    const status=killed?`<span class="killed">☠ Killed</span>`:(s.live?`<span class="ip">In progress</span>`:`<span class="alive">Not killed</span>`);
    const rows=hs.map((h,i)=>`<tr class="${h.me?"me":""} ${h.kill?"krow":""}"><td class="n">${i+1}</td><td class="l" title="${esc(h.name)}">${esc(h.name)}${h.me?" ★":""}${h.kill?'<span class="kill">☠ Kill</span>':""}</td><td title="${full(h.damage)}">${fmt(h.damage)}</td><td class="muted">${(h.damage/tot*100).toFixed(1)}%</td></tr>`).join("");
    return `<div class="panel pcard"><h3>${esc(b.name)}${pill}<span class="st">Boss ${b.step} · Level ${lv}</span><span class="tot" title="${full(tot)}">${fmt(tot)}</span></h3>
      <div class="stack" role="img" aria-label="Damage share per hit">${seg}</div>
      <div class="psum"><span><b>${hs.length}</b> hit${hs.length===1?"":"s"}</span>${status}<span>Biggest: <b>${esc(big.name)}</b> ${fmt(big.damage)}</span></div>
      <table class="plist"><tbody>${rows}</tbody></table></div>`;
  };
  const note=`<div class="note" style="margin-top:12px">Hits are listed in the order they landed${s.live?" (live tracker order)":""}. ${s.live?"":"Archived rows have no hit time, so the order comes from the raw rows, which are stored newest first (each boss level's killing hit is always the first row); the list shows them reversed, oldest first. "}Percent = share of that boss's damage at this level. ☠ Kill = final hit.</div>`;
  return head+`<div class="prog">${bosses.map(card).join("")}</div>`+note;
}

function liveBadge(){
  const el=$("#liveBadge");if(!el)return;
  if(!live){el.style.display="none";return}
  const upd=live.updatedAt?Date.parse(live.updatedAt):0;
  const stale=lastFetchOk&&(Date.now()-lastFetchOk)>3*LIVE_POLL_MS;
  el.style.display="";el.className="livebadge"+(stale?" stale":"");
  el.innerHTML=`<span class="dot"></span>Live · updated ${upd?ago(Date.now()-upd)+" ago":"—"}${stale?" (feed offline)":""}`;
}

    const cp=$("#hlCopy");if(cp)cp.onclick=()=>copyHitsLeft(s);
    const tw2=document.querySelector(".tablewrap");if(tw2){tw2.scrollTop=st;tw2.scrollLeft=sl}
    }
  }
  document.querySelectorAll("#views button").forEach(b=>{b.classList.toggle("on",b.dataset.v===view);b.onclick=()=>{view=b.dataset.v;try{history.replaceState(null,"",view==="progress"?"#progress":location.pathname+location.search)}catch(e){}render()}});

  const upd=archived.map(x=>`${x.label}: ${x.available?new Date(x.updatedAt).toLocaleString():"unavailable"}`).join(" · ");
  $("#foot").innerHTML=`Data: ${esc(DATA.meta.source)}, season raw tabs, Hard difficulty only. Last pulled — ${upd}. Page built ${new Date(DATA.meta.builtAt).toLocaleString()}.`+
   (live?`<br>Live: union raid tracker feed (Raid tab, Hard only), polled every ${LIVE_POLL_MS/1000}s; last data ${live.updatedAt?new Date(live.updatedAt).toLocaleString():"—"}. Live names are linked to past seasons by nickname.`:"")+
   `<br>Hit cap assumes 32 members × 3 hits = 96 (live: from the current member list). Unofficial fan tool; not affiliated with SHIFT UP or Level Infinite.`;
}

// ---- polling: fetch first, JSONP fallback; any failure keeps the archived/last data ----
let useJsonp=false, inflight=false;
function jsonp(url){return new Promise((res,rej)=>{const cb="__liveFeed"+Date.now().toString(36);const sc=document.createElement("script");
  const done=()=>{delete window[cb];sc.remove();clearTimeout(t)};const t=setTimeout(()=>{done();rej(new Error("timeout"))},20000);
  window[cb]=d=>{done();res(d)};sc.onerror=()=>{done();rej(new Error("jsonp error"))};
  sc.src=url+(url.includes("?")?"&":"?")+"callback="+cb;document.head.appendChild(sc)})}
async function getFeed(){
  if(!useJsonp){
    try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),20000);
      const r=await fetch(LIVE_FEED_URL+(LIVE_FEED_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",redirect:"follow",signal:ctl.signal});clearTimeout(t);
      if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();
    }catch(e){useJsonp=true}
  }
  return jsonp(LIVE_FEED_URL);
}
async function poll(){
  if(!LIVE_FEED_URL||inflight)return;inflight=true;
  try{
    const feed=await getFeed();lastFetchOk=Date.now();
    const sig=JSON.stringify([feed&&feed.updatedAt,feed&&feed.totals,feed&&feed.people&&feed.people.length,feed&&feed.season,feed&&feed.live,
      feed&&Array.isArray(feed.people)?feed.people.map(p=>p&&p.name+":"+p.hits).join("|"):"",feed&&Array.isArray(feed.hits)?feed.hits.length:-1]);
    if(sig!==liveSig){
      liveSig=sig;const next=liveSeasonFrom(feed);const had=!!live;live=next;
      if(live&&!had&&!userPicked)cur="LIVE";
      const sel=document.activeElement;
      if(sel&&sel.id==="trendSel")setTimeout(render,1500); else render();
    }
  }catch(e){/* offline / blocked: keep showing archived (and last live) data */}
  finally{inflight=false;liveBadge()}
}
render();
if(LIVE_FEED_URL){poll();setInterval(poll,LIVE_POLL_MS);setInterval(liveBadge,1000);}
})();
</script>
